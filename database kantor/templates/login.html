<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Agenda Surat Canva Vibes</title>
    <!-- 🛑 CSS MURNI PANGGIL DARI FILE EXTERNAL (KAGAK ADA CSS NYATU DI SINI!) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">

    <div class="login-card">
        <h2>WORKSPACE LOGIN</h2>
        <p class="subtitle">Agenda Surat Kantor - Canva Modern Edition</p>

        <form id="formLogin">
            <input type="text" id="username" placeholder="Masukkan Username" required autocomplete="off">
            <input type="password" id="password" placeholder="Masukkan Password" required>
            <button type="submit" class="btn-primary" style="margin-top: 10px;">Masuk ke Dashboard 🚀</button>
        </form>

        <div id="pesanError" class="error-msg"></div>
    </div>

    <!-- ⚡ LOGIKA SCRIPT LOGIN ASYNC -->
    <script>
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('pesanError');
            errBox.style.display = 'none';

            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });

            const data = await res.json();
            if (data.success) {
                window.location.href = '/';
            } else {
                errBox.innerText = data.message;
                errBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
